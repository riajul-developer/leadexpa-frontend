<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leadexpa — অফলাইন / Offline</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: radial-gradient(60rem 30rem at 50% -10%, #f6e3bf 0%, #fbf7f1 60%); color: #2a1613; text-align: center; padding: 24px; }
      img { width: 88px; height: auto; }
      h1 { color: #7a1a12; }
      button { margin-top: 16px; padding: 12px 20px; border: 0; border-radius: 10px; background: #7a1a12; color: #fff; font-size: 16px; box-shadow: 0 1px 2px rgb(100 20 12 / 0.35); }
      p { line-height: 1.7; max-width: 28rem; color: #6b5850; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/leadexpa-mark.png" alt="Leadexpa" width="160" height="146" />
      <h1>আপনি অফলাইনে আছেন</h1>
      <p>ইন্টারনেট ফিরলে Leadexpa আবার চলবে। অফলাইনে লগ করা কলের ফলাফল সংযোগ ফিরলে নিজে থেকেই সিঙ্ক হবে।</p>
      <p lang="en">You're offline. Leadexpa works again when you reconnect; outcomes you logged offline sync automatically.</p>
      <button type="button" onclick="location.reload()">আবার চেষ্টা করুন / Try again</button>
    </main>
  </body>
</html>
